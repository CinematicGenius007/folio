version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns: ['eslint*', 'typescript-eslint', 'prettier', 'vitest', '@types/*', 'playwright-core']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
